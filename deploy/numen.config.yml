version: 1
dataDir: /var/lib/numen

# Cordis levels: error=0, warn=1, info=2, debug=3. NUMEN_LOG_LEVEL/NUMEN_DEBUG override these.
logger:
  levels: { base: 2 }
  showTime: true
  showDiff: false
  capacity: 2000
  maxFileBytes: 1048576
  maxFiles: 5

plugins:
  i18n:
    locales: [en-US]
  database:
    path: /var/lib/numen/numen.db
  capabilities: {}
  controls: {}
  coreControls: {}
  credentials: {}
  resources:
    path: /var/lib/numen/resources
  connections: {}
  http:
    timeout: 30000
  httpSocks: {}
  demo: {}
  httpIntegration: {}
  schedule: {}
  automations: {}
  scheduler: {}
  triggers: {}
  console: {}
  consoleEntries: {}
  consoleAuth: {}
  server:
    host: 0.0.0.0
    port: 5140
  workbench: {}
  workbenchAutomationAuthoring: {}
  workbenchAutomationActivation: {}
  workbenchAutomationCatalog: {}
  workbenchAutomations: {}
  workbenchConnections: {}
  workbenchCredentials: {}
  workbenchHome: {}
  workbenchLogs: {}
  workbenchInvalidation: {}
  workbenchRuns: {}
  consoleSession: {}
  consoleAssets:
    mode: prod
  consoleHttp: {}
  consoleWs: {}
  health: {}
  readiness: {}
