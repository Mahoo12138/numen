name: Verify release candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm numen config validate
      - run: pnpm numen doctor
      - if: matrix.node == 24
        run: pnpm exec playwright install --with-deps chromium
      - if: matrix.node == 24
        run: pnpm exec playwright test

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build versioned image
        env:
          NUMEN_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: node scripts/build-image.mjs
      - name: Verify the built image and durable recovery
        run: node scripts/smoke-image.mjs
      # Registry publication is a separate, explicit release operation.
