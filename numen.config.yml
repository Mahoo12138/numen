version: 1
dataDir: .numen

# Core services are regular Cordis plugins; their inject declarations enforce readiness order.
plugins:
  i18n:
    locales: [en-US]
  database:
    path: .numen/numen.db
  capabilities: {}
  controls: {}
  coreControls: {}
  credentials: {}
  resources:
    path: .numen/resources
  connections: {}
  # Shared outbound client for every Integration. Set proxyAgent to an HTTP(S)
  # proxy URL when direct access is unavailable, e.g. http://127.0.0.1:7890.
  http:
    timeout: 30000
    # noProxy: localhost,127.0.0.1,::1,.home.arpa
    # Omitted noProxy reads NO_PROXY (then no_proxy) once at startup.
  httpSocks: {}
  demo: {}
  httpIntegration: {}
  schedule: {}
  automations: {}
  scheduler: {}
  triggers: {}
  console: {}
  consoleEntries: {}
  consoleAuth: {}
  server:
    host: 127.0.0.1
    port: 5140
  workbench: {}
  workbenchAutomationAuthoring: {}
  workbenchAutomationActivation: {}
  workbenchAutomationCatalog: {}
  workbenchAutomations: {}
  workbenchConnections: {}
  workbenchCredentials: {}
  workbenchHome: {}
  workbenchInvalidation: {}
  workbenchRuns: {}
  consoleSession: {}
  consoleAssets:
    mode: prod
  consoleHttp: {}
  consoleWs: {}
  health: {}
  readiness: {}
