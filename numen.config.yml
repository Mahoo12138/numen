version: 1
dataDir: .numen

# Core services are regular Cordis plugins; their inject declarations enforce readiness order.
plugins:
  database:
    path: .numen/numen.db
  capabilities: {}
  credentials: {}
  resources:
    path: .numen/resources
  connections: {}
  automations: {}
  scheduler: {}
  triggers: {}
  console: {}
  consoleEntries: {}
  consoleAuth: {}
  server:
    host: 127.0.0.1
    port: 5140
  workbench: {}
  workbenchAutomationAuthoring: {}
  workbenchAutomationActivation: {}
  workbenchAutomationCatalog: {}
  workbenchAutomations: {}
  workbenchConnections: {}
  workbenchCredentials: {}
  workbenchHome: {}
  workbenchInvalidation: {}
  workbenchRuns: {}
  consoleSession: {}
  consoleAssets:
    mode: prod
  consoleHttp: {}
  consoleWs: {}
  health: {}
  readiness: {}
